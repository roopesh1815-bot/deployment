<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Dashboard | Northstar</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/dashboard.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="auth-card dashboard-card" aria-labelledby="page-title">
        <a class="brand" href="index.html" aria-label="Northstar home">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span>Northstar</span>
        </a>
        <div class="card-heading">
          <p class="eyebrow">YOUR ACCOUNT</p>
          <h1 id="page-title">You’re logged in</h1>
          <p class="subheading">This is your dashboard. More features are coming soon.</p>
        </div>
        <button class="submit-button" id="logout-button" type="button">Log out</button>
      </section>
      <p class="page-caption">A simpler way to manage your account.</p>
    </main>
  </body>
</html>
